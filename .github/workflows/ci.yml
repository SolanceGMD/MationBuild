name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          test -s MationBuild.ico
      - name: Check for whitespace errors
        run: git diff --check